<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViroKDK & Kchat - Social Experience</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Socket.IO Client Script -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #ffffff; overflow: hidden; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .story-gradient { background: linear-gradient(135deg, #FE2C55 0%, #25F4EE 100%); }
    .cover-gradient { background: linear-gradient(180deg, rgba(3,7,18,0.1) 0%, rgba(3,7,18,0.9) 85%, rgba(3,7,18,1) 100%); }
  </style>
</head>
<body class="h-screen w-screen flex bg-[#030712] text-white overflow-hidden">

  <!-- LEFT SIDEBAR -->
  <aside class="hidden xl:flex flex-col justify-between w-64 border-r border-white/10 p-5 bg-[#030712] shrink-0 h-full overflow-y-auto no-scrollbar">
    <div class="space-y-6">
      <div class="cursor-pointer" onclick="clearSearchAndReload()">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center font-black text-black text-xs">KDK</div>
          <span class="font-extrabold text-xl tracking-tight text-white">ViroKDK</span>
        </div>
        <p class="text-[11px] text-gray-400 italic mt-0.5 ml-1">More than moments...</p>
      </div>

      <nav class="space-y-1">
        <button onclick="clearSearchAndReload()" class="w-full flex items-center space-x-3.5 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white font-bold text-xs transition">
          <i data-lucide="home" class="w-4 h-4 text-[#25F4EE]"></i><span>Home</span>
        </button>
        <button onclick="openChatInterface()" class="w-full flex items-center space-x-3.5 px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-slate-900/50 font-semibold text-xs transition">
          <i data-lucide="message-square" class="w-4 h-4 text-[#FE2C55]"></i><span>Kchat Live</span>
        </button>
        <button onclick="openUploadModal()" class="w-full flex items-center space-x-3.5 px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-slate-900/50 font-semibold text-xs transition">
          <i data-lucide="plus-square" class="w-4 h-4"></i><span>Create Post</span>
        </button>
        <button onclick="openProfileFromNav()" class="w-full flex items-center space-x-3.5 px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-slate-900/50 font-semibold text-xs transition">
          <i data-lucide="user" class="w-4 h-4"></i><span>Profile</span>
        </button>
      </nav>

      <!-- Online Roster Card for Kchat -->
      <div class="space-y-2 pt-2 border-t border-white/10">
        <h4 class="text-[10px] font-extrabold uppercase text-gray-400 tracking-wider">Kchat Online Roster</h4>
        <div id="roster-list" class="space-y-1 overflow-y-auto max-h-48 no-scrollbar">
          <p class="text-[10px] text-gray-500">Connecting...</p>
        </div>
      </div>
    </div>

    <div class="mt-6 p-4 rounded-2xl bg-gradient-to-br from-purple-900/50 via-indigo-900/50 to-rose-900/50 border border-white/10 relative overflow-hidden">
      <h4 class="font-extrabold text-sm text-white leading-tight">Create<br>Share<br>Inspire</h4>
      <p class="text-[10px] text-gray-300 mt-2">Turn your moments into a bigger story.</p>
    </div>
  </aside>

  <!-- CENTER CONTENT AREA -->
  <main class="flex-1 h-full flex flex-col overflow-hidden bg-[#030712]">
    <header class="h-16 border-b border-white/10 px-6 flex items-center justify-between shrink-0 bg-[#030712]">
      <div class="relative flex-1 max-w-xl">
        <i data-lucide="search" class="w-4 h-4 absolute left-4 top-3 text-gray-400"></i>
        <input type="text" id="top-search-input" oninput="handleSearch(this.value)" placeholder="Search videos, users, or hashtags..." class="w-full bg-slate-900/80 border border-white/10 text-xs text-white rounded-xl py-2.5 pl-10 pr-4 focus:outline-none">
      </div>
      <div class="flex items-center space-x-4 pl-4" id="header-avatar-btn">
        <button onclick="openAuthModal()" class="bg-[#FE2C55] px-4 py-1.5 rounded-xl text-xs font-bold text-white hover:bg-red-600 transition">Sign In</button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6 relative">
      <!-- HOME FEED VIEW -->
      <div id="home-feed-view" class="space-y-6">
        <div class="flex items-center space-x-4 overflow-x-auto no-scrollbar py-2 border-b border-white/10">
          <div class="flex flex-col items-center space-y-1 shrink-0 cursor-pointer" onclick="openUploadModal()">
            <div class="w-14 h-14 rounded-full border-2 border-dashed border-white/30 flex items-center justify-center text-white bg-slate-900"><i data-lucide="plus" class="w-5 h-5"></i></div>
            <span class="text-[10px] text-gray-400 font-medium">Your Story</span>
          </div>
        </div>
        <div id="posts-feed-container" class="space-y-6 max-w-2xl mx-auto">
          <div class="flex flex-col justify-center items-center py-12 text-gray-500">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-[#FE2C55] mb-2"></i>
            <p class="text-xs font-semibold">Loading Feed...</p>
          </div>
        </div>
      </div>

      <!-- KCHAT LIVE MESSAGING VIEW -->
      <div id="kchat-view" class="hidden h-full flex flex-col bg-slate-950 rounded-2xl border border-white/10 overflow-hidden">
        <div class="p-4 border-b border-white/10 flex items-center justify-between bg-slate-900">
          <div class="flex items-center space-x-3">
            <h3 class="font-extrabold text-sm text-white">Kchat Live Room</h3>
            <span id="typing-indicator" class="text-[10px] text-emerald-400 font-medium">Group chat active</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="startCall('audio')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-bold text-cyan-400 hover:bg-slate-700">Audio Call</button>
            <button onclick="startCall('video')" class="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-bold text-[#FE2C55] hover:bg-slate-700">Video Call</button>
            <button onclick="clearSearchAndReload()" class="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-bold text-white">Back to Feed</button>
          </div>
        </div>

        <!-- CALL STAGE OVERLAY -->
        <div id="call-stage" class="absolute inset-0 z-30 bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 space-y-4">
          <h3 id="call-status-text" class="text-lg font-bold text-white">Connecting Call...</h3>
          <div class="flex space-x-4">
            <video id="remote-video" autoplay playsinline class="w-72 h-48 bg-slate-900 rounded-2xl object-cover border border-white/10"></video>
            <video id="local-video" autoplay muted playsinline class="w-72 h-48 bg-slate-900 rounded-2xl object-cover border border-white/10"></video>
          </div>
          <button onclick="hangUpCall()" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition">End Call</button>
        </div>

        <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 no-scrollbar"></div>

        <form onsubmit="sendKchatMessage(event)" class="p-4 border-t border-white/10 bg-slate-900 flex items-center space-x-3">
          <input type="text" id="kchat-input" oninput="handleTyping()" placeholder="Message Kchat room..." required class="flex-1 bg-slate-800 text-xs text-white rounded-xl py-2.5 px-4 focus:outline-none border border-white/10">
          <button type="submit" class="px-5 py-2.5 bg-[#FE2C55] text-white font-bold text-xs rounded-xl hover:bg-red-600">Send</button>
        </form>
      </div>

      <!-- PROFILE CONTAINER -->
      <div id="profile-container" class="hidden w-full pb-16"></div>
    </div>
  </main>

  <!-- UPLOAD MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl space-y-4">
      <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h3 class="text-base font-bold text-center border-b border-white/10 pb-3">Create New Post</h3>
      <form onsubmit="handleMediaUpload(event)" class="space-y-4">
        <div class="border-2 border-dashed border-white/20 rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-[#FE2C55] transition bg-black/40" onclick="document.getElementById('upload-file').click()">
          <i data-lucide="image" class="w-10 h-10 text-gray-400 mb-2"></i>
          <p class="text-sm font-bold text-white" id="file-label-text">Select Photo or Video</p>
          <input type="file" id="upload-file" accept="image/*,video/*" required class="hidden" onchange="document.getElementById('file-label-text').innerText = this.files[0]?.name">
        </div>
        <input type="text" id="upload-caption" placeholder="Write a caption..." class="w-full bg-slate-800 text-sm text-white rounded-xl p-3 border border-white/10 focus:outline-none">
        <button type="submit" class="w-full py-2.5 bg-[#FE2C55] text-white font-bold rounded-xl">Share Post</button>
      </form>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h2 class="text-xl font-bold mb-4 text-center">Log In to ViroKDK</h2>
      <form onsubmit="handleAuth(event)" class="space-y-4">
        <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none"/>
        <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none"/>
        <button type="submit" class="w-full bg-[#FE2C55] font-bold py-2.5 rounded-xl text-white">Log In</button>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-white/20 shadow-xl opacity-0 pointer-events-none transition-all duration-300">
    <span id="toast-message">Notification</span>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const SUPABASE_URL = 'https://wjpvqoluqwghxujtyrch.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_y5WtvnM9PB0kIFWyztrJFw_CphEf0Vd';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const socket = io();

    let myName = prompt("Enter your display name for Kchat:") || "Guest";
    let activeDmTarget = null;
    let typingTimer = null;
    let currentCallId = null;
    let localStream = null;
    let peerConnection = null;
    const ICE_CONFIG = { iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] };

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadPosts();
      
      socket.emit("user:join", { name: myName }, (res) => {
        if (res.ok) myName = res.user.name;
      });
    });

    socket.on("roster", (users) => {
      const rosterList = document.getElementById("roster-list");
      rosterList.innerHTML = users.map(u => `
        <div onclick="setDmTarget('${u.id}', '${u.name}')" class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-900 cursor-pointer">
          <span class="text-xs font-bold text-white">${u.name} ${u.id === socket.id ? '(You)' : ''}</span>
          <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
        </div>
      `).join('');
    });

    function openChatInterface() {
      document.getElementById("home-feed-view").classList.add("hidden");
      document.getElementById("profile-container").classList.add("hidden");
      document.getElementById("kchat-view").classList.remove("hidden");
    }

    function clearSearchAndReload() {
      document.getElementById("kchat-view").classList.add("hidden");
      document.getElementById("profile-container").classList.add("hidden");
      document.getElementById("home-feed-view").classList.remove("hidden");
      loadPosts();
    }

    function setDmTarget(id, name) {
      activeDmTarget = (id === socket.id) ? null : id;
      showToast(activeDmTarget ? `Private chat with ${name}` : "Public Kchat room");
    }

    function sendKchatMessage(e) {
      e.preventDefault();
      const input = document.getElementById("kchat-input");
      const text = input.value.trim();
      if (!text) return;
      socket.emit("chat:message", { text, to: activeDmTarget }, (res) => {
        if (res.ok) input.value = "";
      });
    }

    socket.on("chat:message", (msg) => {
      const container = document.getElementById("chat-messages-container");
      const isMe = msg.from.id === socket.id;
      const bubble = document.createElement("div");
      bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      bubble.innerHTML = `
        <span class="text-[9px] text-gray-400">${msg.from.name}</span>
        <div class="max-w-[75%] px-4 py-2 rounded-xl text-xs ${isMe ? 'bg-[#FE2C55] text-white' : 'bg-slate-900 border border-white/10 text-gray-200'}">${msg.text}</div>
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    });

    function handleTyping() {
      socket.emit("chat:typing", { typing: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit("chat:typing", { typing: false }), 1500);
    }

    socket.on("chat:typing", (data) => {
      document.getElementById("typing-indicator").innerText = data.typing ? `${data.from.name} is typing...` : "Group chat active";
    });

    async function startCall(mediaType) {
      const res = await new Promise(resolve => socket.emit("call:invite", { to: activeDmTarget, media: mediaType }, resolve));
      if (!res.ok) { showToast(res.error || "Select someone in roster for 1-1 call or use public mode"); return; }
      currentCallId = res.callId;
      document.getElementById("call-stage").classList.remove("hidden");
      await setupPeerConnection(true);
    }

    socket.on("call:incoming", async (data) => {
      if (confirm(`Incoming ${data.media} call from ${data.from.name}. Accept?`)) {
        currentCallId = data.callId;
        document.getElementById("call-stage").classList.remove("hidden");
        socket.emit("call:accept", { callId: currentCallId });
        await setupPeerConnection(false);
      } else {
        socket.emit("call:decline", { callId: data.callId });
      }
    });

    socket.on("call:accepted", async (data) => {
      currentCallId = data.callId;
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit("webrtc:signal", { callId: currentCallId, data: { type: "offer", sdp: offer.sdp } });
    });

    socket.on("call:over", () => { hangUpCall(false); showToast("Call ended"); });

    async function setupPeerConnection(isCaller) {
      peerConnection = new RTCPeerConnection(ICE_CONFIG);
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        document.getElementById("local-video").srcObject = localStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      } catch (err) { console.warn("No camera/mic:", err); }

      peerConnection.ontrack = (event) => { document.getElementById("remote-video").srcObject = event.streams[0]; };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit("webrtc:signal", { callId: currentCallId, data: { type: "candidate", candidate: event.candidate } });
      };

      socket.on("webrtc:signal", async (signal) => {
        if (!peerConnection) return;
        const d = signal.data;
        if (d.type === "offer") {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(d));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit("webrtc:signal", { callId: currentCallId, data: { type: "answer", sdp: answer.sdp } });
        } else if (d.type === "answer") {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(d));
        } else if (d.type === "candidate") {
          await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate));
        }
      });
    }

    function hangUpCall(notifyServer = true) {
      if (notifyServer && currentCallId) socket.emit("call:end", { callId: currentCallId });
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      currentCallId = null;
      document.getElementById("call-stage").classList.add("hidden");
    }

    async function loadPosts() {
      const { data: posts } = await db.from('videos').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('posts-feed-container');
      if (!posts || posts.length === 0) { container.innerHTML = `<p class="text-center text-gray-500 py-12">No posts yet.</p>`; return; }
      container.innerHTML = posts.map(p => `
        <div class="bg-slate-900 border border-white/10 rounded-2xl overflow-hidden shadow-2xl p-4 space-y-3">
          <div class="flex items-center space-x-3"><span class="font-bold text-xs text-white">@${p.username || 'user'}</span></div>
          <div class="w-full aspect-[4/3] bg-black rounded-xl overflow-hidden flex items-center justify-center">
            ${p.video_url.match(/\.(mp4|webm)$/i) ? `<video src="${p.video_url}" class="w-full h-full object-cover" controls></video>` : `<img src="${p.video_url}" class="w-full h-full object-cover">`}
          </div>
          <p class="text-xs text-gray-200">${p.caption || ''}</p>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
    function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }
    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-message").textContent = msg;
      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => toast.classList.add("opacity-0", "pointer-events-none"), 2500);
    }
  </script>
</body>
</html>
