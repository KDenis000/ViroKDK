<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViroKDK - Social Feed</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      user-select: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .story-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
  </style>
</head>
<body class="h-screen w-screen flex bg-black text-white overflow-hidden">

  <!-- LEFT SIDEBAR NAVIGATION -->
  <aside class="hidden md:flex flex-col justify-between w-16 lg:w-64 border-r border-neutral-800 p-4 bg-black z-30 shrink-0">
    <div class="space-y-6">
      <!-- Logo -->
      <div class="flex items-center space-x-3 px-2 py-2 cursor-pointer" onclick="clearSearchAndReload()">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center font-black text-black text-xs tracking-tighter">
          KDK
        </div>
        <h1 class="hidden lg:block font-extrabold text-xl tracking-tight text-white">ViroKDK</h1>
      </div>

      <!-- Search Input Box -->
      <div class="hidden lg:block relative w-full px-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-4 top-3 text-neutral-400"></i>
        <input type="text" id="sidebar-search-input" oninput="handleSearch(this.value)" placeholder="Search posts or users..." class="w-full bg-neutral-900 text-xs text-white rounded-xl py-2.5 pl-10 pr-4 focus:outline-none border border-neutral-800">
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-2">
        <button onclick="clearSearchAndReload()" class="w-full flex items-center space-x-4 p-3 rounded-xl text-white font-bold hover:bg-neutral-900 transition">
          <i data-lucide="home" class="w-6 h-6"></i>
          <span class="hidden lg:block">Home</span>
        </button>
        <button onclick="openUploadModal()" class="w-full flex items-center space-x-4 p-3 rounded-xl text-neutral-300 font-semibold hover:bg-neutral-900 transition">
          <i data-lucide="plus-square" class="w-6 h-6"></i>
          <span class="hidden lg:block">Create</span>
        </button>
        <button onclick="openProfileFromNav()" class="w-full flex items-center space-x-4 p-3 rounded-xl text-neutral-300 font-semibold hover:bg-neutral-900 transition">
          <i data-lucide="user" class="w-6 h-6"></i>
          <span class="hidden lg:block">Profile</span>
        </button>
      </nav>
    </div>

    <!-- User Account Bottom Row -->
    <div id="desktop-user-card" class="pt-4 border-t border-neutral-800 flex items-center justify-between">
      <button onclick="openAuthModal()" class="w-full py-2 bg-[#FE2C55] hover:bg-red-600 rounded-xl font-bold text-sm transition text-center">Sign In</button>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 h-full overflow-y-auto no-scrollbar flex justify-center bg-black">
    <div class="w-full max-w-3xl flex flex-col items-center p-4 lg:p-8">
      
      <!-- CENTER FEED AREA -->
      <div class="w-full max-w-[470px] space-y-6">
        
        <!-- STORIES TRAY -->
        <div class="flex items-center space-x-4 overflow-x-auto no-scrollbar py-2 border-b border-neutral-900 w-full">
          <div class="flex flex-col items-center space-y-1 shrink-0 cursor-pointer" onclick="openUploadModal()">
            <div class="relative w-16 h-16 rounded-full p-[2px] bg-neutral-800 flex items-center justify-center">
              <div class="w-full h-full rounded-full bg-neutral-900 flex items-center justify-center text-white">
                <i data-lucide="plus" class="w-6 h-6"></i>
              </div>
            </div>
            <span class="text-[11px] text-neutral-400">Your Story</span>
          </div>
        </div>

        <!-- POSTS FEED CONTAINER -->
        <div id="posts-feed-container" class="space-y-6 w-full">
          <div class="flex flex-col justify-center items-center py-12 text-neutral-500">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-[#FE2C55] mb-2"></i>
            <p class="text-xs font-semibold">Loading Feed...</p>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- MOBILE BOTTOM NAVBAR -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 h-14 bg-black border-t border-neutral-800 z-40 flex justify-around items-center px-2">
    <button onclick="clearSearchAndReload()" class="text-white">
      <i data-lucide="home" class="w-6 h-6"></i>
    </button>
    <button onclick="openUploadModal()" class="text-white">
      <i data-lucide="plus-square" class="w-6 h-6"></i>
    </button>
    <button onclick="openProfileFromNav()" class="text-neutral-400 hover:text-white">
      <i data-lucide="user" class="w-6 h-6"></i>
    </button>
  </nav>

  <!-- UPLOAD MEDIA MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl space-y-4">
      <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-base font-bold text-center border-b border-neutral-800 pb-3">Create New Post</h3>

      <form id="upload-form" onsubmit="handleMediaUpload(event)" class="space-y-4">
        <div class="border-2 border-dashed border-neutral-700 rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-[#FE2C55] transition bg-black/40" onclick="document.getElementById('upload-file').click()">
          <i data-lucide="image" class="w-10 h-10 text-neutral-400 mb-2"></i>
          <p class="text-sm font-bold text-white" id="file-label-text">Select Photo or Video to Upload</p>
          <p class="text-xs text-neutral-500 mt-1">Supports JPG, PNG, MP4, WEBP</p>
          <input type="file" id="upload-file" accept="image/*,video/*" required class="hidden" onchange="document.getElementById('file-label-text').innerText = this.files[0]?.name">
        </div>

        <div>
          <label class="text-xs font-semibold text-neutral-400 mb-1 block">Caption</label>
          <input type="text" id="upload-caption" placeholder="Write a caption..." class="w-full bg-neutral-800 text-sm text-white rounded-xl p-3 border border-neutral-700 focus:outline-none">
        </div>

        <p id="upload-message" class="text-xs text-center font-semibold hidden"></p>

        <button type="submit" id="upload-submit-btn" class="w-full py-2.5 bg-[#FE2C55] hover:bg-red-600 text-white font-bold rounded-xl transition">
          Share Post
        </button>
      </form>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h2 id="modal-title" class="text-xl font-bold mb-4 text-center">Log In to ViroKDK</h2>
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="username-container" class="hidden">
          <label class="text-xs font-semibold text-neutral-400 block mb-1">USERNAME</label>
          <input type="text" id="auth-username" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-white text-sm focus:outline-none" placeholder="e.g. kdk_creator"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-neutral-400 block mb-1">EMAIL</label>
          <input type="email" id="auth-email" required class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-white text-sm focus:outline-none" placeholder="you@example.com"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-neutral-400 block mb-1">PASSWORD</label>
          <input type="password" id="auth-password" required minlength="6" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-white text-sm focus:outline-none" placeholder="••••••••"/>
        </div>
        <p id="auth-message" class="text-sm text-center font-medium hidden"></p>
        <button type="submit" id="auth-submit-btn" class="w-full bg-[#FE2C55] hover:bg-red-600 font-bold py-2.5 rounded-xl transition text-white">
          Log In
        </button>
      </form>
      <div class="mt-4 text-center text-xs text-neutral-400">
        <span id="toggle-text">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="toggle-btn" class="text-[#25F4EE] font-semibold underline ml-1">Sign Up</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="edit-profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
      <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 class="text-lg font-bold text-center">Edit Profile</h3>
      <form onsubmit="saveProfileChanges(event)" class="space-y-4">
        
        <div class="flex flex-col items-center justify-center space-y-2">
          <div class="relative w-20 h-20 rounded-full overflow-hidden border-2 border-[#25F4EE] group cursor-pointer" onclick="document.getElementById('edit-avatar-file').click()">
            <img id="edit-avatar-preview" src="" class="w-full h-full object-cover hidden">
            <div id="edit-avatar-placeholder" class="w-full h-full bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center text-2xl font-bold text-black">?</div>
          </div>
          <span class="text-xs text-cyan-400 font-semibold cursor-pointer" onclick="document.getElementById('edit-avatar-file').click()">Change Profile Photo</span>
          <input type="file" id="edit-avatar-file" accept="image/*" class="hidden" onchange="handleAvatarFileSelect(event)">
        </div>

        <div>
          <label class="text-xs font-semibold text-neutral-400 block mb-1">Display Name</label>
          <input type="text" id="edit-name-input" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm text-white focus:outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-neutral-400 block mb-1">Username (@)</label>
          <input type="text" id="edit-username-input" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm text-white focus:outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-neutral-400 block mb-1">Bio</label>
          <textarea id="edit-bio-input" rows="3" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm text-white focus:outline-none"></textarea>
        </div>

        <button type="submit" id="save-profile-btn" class="w-full py-3 bg-[#FE2C55] hover:bg-red-600 font-bold rounded-xl text-white transition">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- COMMENTS DRAWER MODAL -->
  <div id="comment-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl h-[500px] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-neutral-800 flex items-center justify-between">
        <h3 class="font-bold text-sm">Comments</h3>
        <button onclick="closeCommentDrawer()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="comment-list" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
      <form onsubmit="postComment(event)" class="p-3 border-t border-neutral-800 flex items-center space-x-2 bg-black">
        <input type="text" id="comment-input" placeholder="Add a comment..." required class="flex-1 bg-neutral-800 text-sm text-white rounded-full py-2 px-4 focus:outline-none border border-neutral-700">
        <button type="submit" class="text-[#FE2C55] font-bold text-xs hover:text-white px-2">Post</button>
      </form>
    </div>
  </div>

  <!-- PROFILE VIEW CONTAINER -->
  <div id="profile-container" class="fixed inset-0 z-40 bg-black hidden overflow-y-auto p-6 lg:p-12"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-neutral-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-neutral-700 shadow-xl opacity-0 pointer-events-none transition-all duration-300">
    <span id="toast-message">Notification</span>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const SUPABASE_URL = 'https://wjpvqoluqwghxujtyrch.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_y5WtvnM9PB0kIFWyztrJFw_CphEf0Vd';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;
    let activeVideoId = null;
    let allPostsCache = [];
    let currentProfileUserId = null;
    let selectedAvatarBase64 = null;

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkUserSession();
      loadPosts();
    });

    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
    function openUploadModal() { 
      db.auth.getSession().then(({ data: { session } }) => {
        if (!session) { openAuthModal(); showToast("Please sign in to upload"); return; }
        document.getElementById('upload-modal').classList.remove('hidden'); 
      });
    }
    function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }
    function closeProfilePage() { document.getElementById('profile-container').classList.add('hidden'); }

    function handleAvatarFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedAvatarBase64 = e.target.result;
          const preview = document.getElementById('edit-avatar-preview');
          const placeholder = document.getElementById('edit-avatar-placeholder');
          preview.src = selectedAvatarBase64;
          preview.classList.remove('hidden');
          placeholder.classList.add('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function openEditProfileModal() {
      db.auth.getSession().then(({ data: { session } }) => {
        if (!session) return;
        const userMeta = session.user.user_metadata || {};
        document.getElementById('edit-name-input').value = userMeta.display_name || userMeta.username || '';
        document.getElementById('edit-username-input').value = userMeta.username || '';
        document.getElementById('edit-bio-input').value = userMeta.bio || '';
        
        const preview = document.getElementById('edit-avatar-preview');
        const placeholder = document.getElementById('edit-avatar-placeholder');

        if (userMeta.avatar_url) {
          preview.src = userMeta.avatar_url;
          preview.classList.remove('hidden');
          placeholder.classList.add('hidden');
        } else {
          preview.classList.add('hidden');
          placeholder.classList.remove('hidden');
          placeholder.innerText = (userMeta.username || 'U').charAt(0).toUpperCase();
        }

        document.getElementById('edit-profile-modal').classList.remove('hidden');
      });
    }
    function closeEditProfileModal() { document.getElementById('edit-profile-modal').classList.add('hidden'); }

    async function saveProfileChanges(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('save-profile-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving changes...";

      const newName = document.getElementById('edit-name-input').value;
      const newUsername = document.getElementById('edit-username-input').value;
      const newBio = document.getElementById('edit-bio-input').value;

      const { data: { session } } = await db.auth.getSession();
      let avatarUrl = session.user.user_metadata?.avatar_url || null;

      if (selectedAvatarBase64) {
        avatarUrl = selectedAvatarBase64;
      }

      const { error } = await db.auth.updateUser({
        data: { display_name: newName, username: newUsername, bio: newBio, avatar_url: avatarUrl }
      });

      saveBtn.disabled = false;
      saveBtn.innerText = "Save Changes";

      if (error) {
        showToast(error.message);
      } else {
        showToast("Profile updated successfully!");
        selectedAvatarBase64 = null;
        closeEditProfileModal();
        checkUserSession();
        viewProfile(currentProfileUserId, newUsername);
      }
    }

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('modal-title').innerText = isSignUp ? 'Create ViroKDK Account' : 'Log In to ViroKDK';
      document.getElementById('auth-submit-btn').innerText = isSignUp ? 'Sign Up' : 'Log In';
      document.getElementById('toggle-text').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggle-btn').innerText = isSignUp ? 'Log In' : 'Sign Up';
      document.getElementById('username-container').classList.toggle('hidden', !isSignUp);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value;
      const msg = document.getElementById('auth-message');

      msg.classList.remove('hidden', 'text-green-400', 'text-red-400');
      msg.innerText = 'Processing...';

      let result = isSignUp 
        ? await db.auth.signUp({ email, password, options: { data: { username, display_name: username, bio: "Hey there! I am using ViroKDK." } } })
        : await db.auth.signInWithPassword({ email, password });

      if (result.error) {
        msg.classList.add('text-red-400');
        msg.innerText = result.error.message;
      } else {
        msg.classList.add('text-green-400');
        msg.innerText = isSignUp ? 'Account created! Log in.' : 'Logged in successfully!';
        if (!isSignUp) {
          setTimeout(() => { closeAuthModal(); checkUserSession(); loadPosts(); }, 1000);
        }
      }
    }

    async function checkUserSession() {
      const { data: { session } } = await db.auth.getSession();
      const desktopUserCard = document.getElementById('desktop-user-card');

      if (session?.user) {
        const userMeta = session.user.user_metadata || {};
        const username = userMeta.username || session.user.email.split('@')[0];
        const avatarUrl = userMeta.avatar_url;

        const avatarHTML = avatarUrl 
          ? `<img src="${avatarUrl}" class="w-8 h-8 rounded-full object-cover border border-[#25F4EE]">`
          : `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center font-bold text-black text-xs">${username.charAt(0).toUpperCase()}</div>`;

        desktopUserCard.innerHTML = `
          <div class="flex items-center justify-between w-full cursor-pointer" onclick="viewProfile('${session.user.id}', '${username}')">
            <div class="flex items-center space-x-3">
              ${avatarHTML}
              <p class="hidden lg:block text-xs font-bold text-white truncate">@${username}</p>
            </div>
            <button onclick="handleLogout(event)" class="text-neutral-400 hover:text-white"><i data-lucide="log-out" class="w-4 h-4"></i></button>
          </div>`;
      } else {
        desktopUserCard.innerHTML = `<button onclick="openAuthModal()" class="w-full py-2 bg-[#FE2C55] hover:bg-red-600 rounded-xl font-bold text-sm transition text-center">Sign In</button>`;
      }
      lucide.createIcons();
    }

    async function handleLogout(e) {
      e.stopPropagation();
      await db.auth.signOut();
      checkUserSession();
      loadPosts();
      showToast("Logged out");
    }

    async function handleMediaUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('upload-file');
      const captionInput = document.getElementById('upload-caption');
      const msg = document.getElementById('upload-message');
      const btn = document.getElementById('upload-submit-btn');

      const file = fileInput.files[0];
      if (!file) return;

      const { data: { session } } = await db.auth.getSession();
      if (!session) { openAuthModal(); return; }

      msg.classList.remove('hidden', 'text-red-400', 'text-green-400');
      msg.innerText = 'Uploading file...';
      btn.disabled = true;

      const fileExt = file.name.split('.').pop();
      const filePath = `posts/${session.user.id}_${Date.now()}.${fileExt}`;

      const { error: uploadError } = await db.storage.from('videos').upload(filePath, file);
      if (uploadError) {
        msg.classList.add('text-red-400');
        msg.innerText = uploadError.message;
        btn.disabled = false;
        return;
      }

      const { data: publicUrlData } = db.storage.from('videos').getPublicUrl(filePath);
      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];

      const { error: dbError } = await db
        .from('videos')
        .insert([{ user_id: session.user.id, username: username, caption: captionInput.value, video_url: publicUrlData.publicUrl, likes_count: 0 }]);

      btn.disabled = false;
      if (dbError) {
        msg.classList.add('text-red-400');
        msg.innerText = dbError.message;
      } else {
        msg.classList.add('text-green-400');
        msg.innerText = 'Published successfully!';
        setTimeout(() => {
          closeUploadModal();
          fileInput.value = '';
          captionInput.value = '';
          msg.classList.add('hidden');
          loadPosts();
        }, 1200);
      }
    }

    async function likeVideo(videoId, currentLikes) {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { openAuthModal(); return; }

      const newLikes = currentLikes + 1;
      const { error } = await db.from('videos').update({ likes_count: newLikes }).eq('id', videoId);
      if (!error) loadPosts();
    }

    async function openComments(videoId) {
      activeVideoId = videoId;
      document.getElementById('comment-drawer').classList.remove('hidden');
      loadComments(videoId);
    }

    function closeCommentDrawer() {
      document.getElementById('comment-drawer').classList.add('hidden');
      activeVideoId = null;
    }

    async function loadComments(videoId) {
      const list = document.getElementById('comment-list');
      list.innerHTML = `<p class="text-xs text-neutral-500 text-center py-4">Loading comments...</p>`;

      const { data: comments } = await db.from('comments').select('*').eq('video_id', videoId).order('created_at', { ascending: false });

      if (!comments || comments.length === 0) {
        list.innerHTML = `<p class="text-xs text-neutral-500 text-center py-6">No comments yet.</p>`;
        return;
      }

      list.innerHTML = comments.map(c => `
        <div class="flex space-x-3 items-start bg-neutral-800/40 p-2.5 rounded-xl text-xs">
          <span class="font-bold text-[#25F4EE]">@${c.username}</span>
          <p class="text-neutral-200">${c.comment_text}</p>
        </div>
      `).join('');
    }

    async function postComment(e) {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      if (!text || !activeVideoId) return;

      const { data: { session } } = await db.auth.getSession();
      if (!session) { openAuthModal(); return; }

      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
      const { error } = await db.from('comments').insert([{ video_id: activeVideoId, user_id: session.user.id, username: username, comment_text: text }]);

      if (!error) {
        input.value = '';
        loadComments(activeVideoId);
      }
    }

    // SEARCH FUNCTIONALITY
    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderFeed(allPostsCache);
        return;
      }
      const filtered = allPostsCache.filter(p => 
        (p.caption && p.caption.toLowerCase().includes(q)) || 
        (p.username && p.username.toLowerCase().includes(q))
      );
      renderFeed(filtered);
    }

    function clearSearchAndReload() {
      const input = document.getElementById('sidebar-search-input');
      if (input) input.value = '';
      renderFeed(allPostsCache);
    }

    async function loadPosts() {
      try {
        const { data: posts, error } = await db.from('videos').select('*').order('created_at', { ascending: false });
        if (error || !posts || posts.length === 0) {
          document.getElementById('posts-feed-container').innerHTML = `<p class="text-center text-neutral-500 py-12 text-sm">No posts yet. Click Create to post!</p>`;
          return;
        }
        allPostsCache = posts;
        renderFeed(allPostsCache);
      } catch (err) {
        document.getElementById('posts-feed-container').innerHTML = `<p class="text-center text-red-500 py-6 text-xs">Failed to load feed.</p>`;
      }
    }

    function renderFeed(posts) {
      const container = document.getElementById('posts-feed-container');
      if (!posts || posts.length === 0) {
        container.innerHTML = `<p class="text-center text-neutral-500 py-12 text-sm">No matching posts found.</p>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const username = post.username || 'creator';
        const isVideo = post.video_url.match(/\.(mp4|webm|mov)$/i);

        return `
          <div class="bg-black border border-neutral-900 rounded-2xl overflow-hidden shadow-xl w-full">
            <div class="flex items-center justify-between p-3 border-b border-neutral-900">
              <div class="flex items-center space-x-3 cursor-pointer" onclick="viewProfile('${post.user_id}', '${username}')">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center font-bold text-black text-xs">
                  ${username.charAt(0).toUpperCase()}
                </div>
                <span class="font-bold text-xs text-white">@${username}</span>
              </div>
              <i data-lucide="more-horizontal" class="w-4 h-4 text-neutral-400"></i>
            </div>

            <div class="w-full bg-neutral-950 aspect-square flex items-center justify-center overflow-hidden">
              ${isVideo ? `
                <video src="${post.video_url}" class="w-full h-full object-cover cursor-pointer" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
              ` : `
                <img src="${post.video_url}" class="w-full h-full object-cover" alt="Post Image">
              `}
            </div>

            <div class="p-3 space-y-2">
              <div class="flex items-center justify-between text-white">
                <div class="flex items-center space-x-4">
                  <button onclick="likeVideo('${post.id}', ${post.likes_count || 0})">
                    <i data-lucide="heart" class="w-6 h-6 hover:text-[#FE2C55] transition"></i>
                  </button>
                  <button onclick="openComments('${post.id}')">
                    <i data-lucide="message-circle" class="w-6 h-6 hover:text-cyan-400 transition"></i>
                  </button>
                </div>
              </div>

              <p class="text-xs font-bold text-white">${post.likes_count || 0} likes</p>
              <p class="text-xs text-neutral-300"><span class="font-bold text-white mr-2">@${username}</span>${post.caption || ''}</p>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function playProfileVideo(vEl) {
      if (vEl.paused) { vEl.play(); } else { vEl.pause(); }
    }

    async function viewProfile(userId, fallbackUsername = 'creator') {
      currentProfileUserId = userId;
      const container = document.getElementById('profile-container');
      container.classList.remove('hidden');
      container.innerHTML = `<p class="text-center py-12 text-neutral-400">Loading Profile...</p>`;

      const { data: sessionData } = await db.auth.getSession();
      const currentUserId = sessionData?.session?.user?.id;

      const { data: videos } = await db.from('videos').select('*').eq('user_id', userId).order('created_at', { ascending: false });

      let username = fallbackUsername;
      let displayName = fallbackUsername;
      let bio = "No bio yet.";
      let avatarUrl = null;

      if (currentUserId === userId && sessionData?.session?.user?.user_metadata) {
        const meta = sessionData.session.user.user_metadata;
        username = meta.username || fallbackUsername;
        displayName = meta.display_name || username;
        bio = meta.bio || "No bio yet.";
        avatarUrl = meta.avatar_url;
      } else if (videos && videos.length > 0 && videos[0].username) {
        username = videos[0].username;
        displayName = videos[0].username;
      }

      const avatarDisplay = avatarUrl 
        ? `<img src="${avatarUrl}" class="w-20 h-20 rounded-full object-cover shadow-2xl border-2 border-[#25F4EE] shrink-0">`
        : `<div class="w-20 h-20 rounded-full bg-gradient-to-tr from-[#FE2C55] to-[#25F4EE] flex items-center justify-center text-3xl font-bold text-black shrink-0">${username.charAt(0).toUpperCase()}</div>`;

      container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
          <button onclick="closeProfilePage()" class="px-4 py-2 bg-neutral-900 rounded-xl text-xs font-bold text-white">← Back</button>
          
          <div class="flex items-center justify-between border-b border-neutral-800 pb-6">
            <div class="flex items-center space-x-6">
              ${avatarDisplay}
              <div>
                <h2 class="text-xl font-bold text-white">${displayName}</h2>
                <p class="text-xs text-neutral-400 mt-0.5">@${username}</p>
                <p class="text-xs text-neutral-300 mt-2">${bio}</p>
              </div>
            </div>

            ${currentUserId === userId ? `
              <button onclick="openEditProfileModal()" class="px-5 py-2 rounded-xl font-bold text-xs bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 transition">
                Edit profile
              </button>
            ` : ''}
          </div>

          <div class="grid grid-cols-3 gap-2">
            ${videos && videos.length > 0 ? videos.map(v => {
              const isVideo = v.video_url.match(/\.(mp4|webm|mov)$/i);
              return `
                <div class="aspect-square bg-neutral-900 rounded-lg overflow-hidden relative cursor-pointer group" onclick="${isVideo ? "playProfileVideo(this.querySelector('video'))" : ""}">
                  ${isVideo ? `
                    <video src="${v.video_url}" class="w-full h-full object-cover" loop playsinline></video>
                    <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                      <i data-lucide="play" class="w-6 h-6 text-white"></i>
                    </div>
                  ` : `
                    <img src="${v.video_url}" class="w-full h-full object-cover">
                  `}
                </div>
              `;
            }).join('') : '<p class="col-span-3 text-center py-12 text-xs text-neutral-500">No posts yet.</p>'}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function openProfileFromNav() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { openAuthModal(); return; }
      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
      viewProfile(session.user.id, username);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-message").textContent = msg;
      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => { toast.classList.add("opacity-0", "pointer-events-none"); }, 2500);
    }
  </script>
</body>
</html>
