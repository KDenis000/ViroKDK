<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ViroKDK</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Hide scrollbars for smooth TikTok-style feed */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-between overflow-hidden">

  <!-- Header Navigation -->
  <header class="flex justify-between items-center p-4 border-b border-gray-800 bg-black z-10">
    <h1 class="text-2xl font-bold tracking-wider text-red-500">ViroKDK</h1>
    <div id="auth-header">
      <!-- Dynamic User Info or Login Button -->
      <button onclick="openAuthModal()" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-full font-semibold text-sm transition">
        Sign In
      </button>
    </div>
  </header>

  <!-- Video Feed Container -->
  <main class="flex-1 flex justify-center items-center overflow-hidden relative">
    <div class="text-center text-gray-500">
      <i class="fa-solid fa-play-circle text-6xl mb-2"></i>
      <p>Video Feed Loading...</p>
    </div>
  </main>

  <!-- Authentication Modal (Sign Up / Login) -->
  <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center hidden z-50 p-4">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-full max-w-md relative">
      <!-- Close Button -->
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Modal Title -->
      <h2 id="modal-title" class="text-2xl font-bold mb-4 text-center">Log In to ViroKDK</h2>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <!-- Extra input for Username (Sign Up only) -->
        <div id="username-container" class="hidden">
          <label class="block text-xs font-semibold mb-1 text-gray-400">USERNAME</label>
          <input type="text" id="auth-username" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500" placeholder="e.g. kdk_creator"/>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-400">EMAIL</label>
          <input type="email" id="auth-email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500" placeholder="you@example.com"/>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-400">PASSWORD</label>
          <input type="password" id="auth-password" required minlength="6" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500" placeholder="••••••••"/>
        </div>

        <!-- Status / Error Messages -->
        <p id="auth-message" class="text-sm text-center font-medium hidden"></p>

        <!-- Submit Button -->
        <button type="submit" id="auth-submit-btn" class="w-full bg-red-500 hover:bg-red-600 font-bold py-2.5 rounded-lg transition">
          Log In
        </button>
      </form>

      <!-- Toggle Sign Up / Login -->
      <div class="mt-4 text-center text-sm text-gray-400">
        <span id="toggle-text">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="toggle-btn" class="text-red-500 font-semibold underline ml-1">
          Sign Up
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Integration -->
  <script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = 'https://wjpvqoluqwghxujtyrch.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_...'; // Ensure your publishable key is here
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;

    // 2. Auth Modal Controls
    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('auth-message').classList.add('hidden');
    }

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      const modalTitle = document.getElementById('modal-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const toggleText = document.getElementById('toggle-text');
      const toggleBtn = document.getElementById('toggle-btn');
      const usernameContainer = document.getElementById('username-container');

      if (isSignUp) {
        modalTitle.innerText = 'Create ViroKDK Account';
        submitBtn.innerText = 'Sign Up';
        toggleText.innerText = 'Already have an account?';
        toggleBtn.innerText = 'Log In';
        usernameContainer.classList.remove('hidden');
      } else {
        modalTitle.innerText = 'Log In to ViroKDK';
        submitBtn.innerText = 'Log In';
        toggleText.innerText = "Don't have an account?";
        toggleBtn.innerText = 'Sign Up';
        usernameContainer.classList.add('hidden');
      }
    }

    // 3. Handle Sign Up and Login Submissions
    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value;
      const messageEl = document.getElementById('auth-message');

      messageEl.classList.remove('hidden', 'text-green-500', 'text-red-500');
      messageEl.innerText = 'Processing...';

      if (isSignUp) {
        // Sign Up with Supabase Auth
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { username: username }
          }
        });

        if (error) {
          messageEl.classList.add('text-red-500');
          messageEl.innerText = error.message;
        } else {
          messageEl.classList.add('text-green-500');
          messageEl.innerText = 'Account created! Check your email to confirm, or log in.';
        }
      } else {
        // Log In with Supabase Auth
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          messageEl.classList.add('text-red-500');
          messageEl.innerText = error.message;
        } else {
          messageEl.classList.add('text-green-500');
          messageEl.innerText = 'Logged in successfully!';
          setTimeout(() => {
            closeAuthModal();
            checkUserSession();
          }, 1000);
        }
      }
    }

    // 4. Track Active User Session
    async function checkUserSession() {
      const { data: { session } } = await supabase.auth.getSession();
      const authHeader = document.getElementById('auth-header');

      if (session && session.user) {
        const email = session.user.email;
        authHeader.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs text-gray-400 hidden sm:inline">${email}</span>
            <button onclick="handleLogout()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold transition">
              Log Out
            </button>
          </div>
        `;
      } else {
        authHeader.innerHTML = `
          <button onclick="openAuthModal()" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-full font-semibold text-sm transition">
            Sign In
          </button>
        `;
      }
    }

    // 5. Handle Logout
    async function handleLogout() {
      await supabase.auth.signOut();
      checkUserSession();
    }

    // Check session on page start
    checkUserSession();
  </script>
</body>
</html>
