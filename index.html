<script>
  const SUPABASE_URL = 'https://wjpvqoluqwghxujtyrch.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y5WtvnM9PB0kIFWyztrJFw_CphEf0Vd';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let isSignUp = false;
  let activeVideoId = null;

  function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
  function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
  function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
  function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }

  function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('modal-title').innerText = isSignUp ? 'Create ViroKDK Account' : 'Log In to ViroKDK';
    document.getElementById('auth-submit-btn').innerText = isSignUp ? 'Sign Up' : 'Log In';
    document.getElementById('toggle-text').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggle-btn').innerText = isSignUp ? 'Log In' : 'Sign Up';
    document.getElementById('username-container').classList.toggle('hidden', !isSignUp);
  }

  async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const username = document.getElementById('auth-username').value;
    const msg = document.getElementById('auth-message');

    msg.classList.remove('hidden', 'text-green-500', 'text-red-500');
    msg.innerText = 'Processing...';

    let result = isSignUp 
      ? await db.auth.signUp({ email, password, options: { data: { username } } })
      : await db.auth.signInWithPassword({ email, password });

    if (result.error) {
      msg.classList.add('text-red-500');
      msg.innerText = result.error.message;
    } else {
      msg.classList.add('text-green-500');
      msg.innerText = isSignUp ? 'Account created! Check email or log in.' : 'Logged in successfully!';
      if (!isSignUp) setTimeout(() => { closeAuthModal(); checkUserSession(); loadVideos(); }, 1000);
    }
  }

  async function checkUserSession() {
    const { data: { session } } = await db.auth.getSession();
    const authHeader = document.getElementById('auth-header');
    const uploadBtn = document.getElementById('upload-nav-btn');

    if (session?.user) {
      uploadBtn.classList.remove('hidden');
      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
      authHeader.innerHTML = `
        <div class="flex items-center space-x-2">
          <button onclick="viewProfile('${session.user.id}', '${username}')" class="text-xs text-gray-300 hover:text-white font-medium bg-gray-800 px-3 py-1.5 rounded-full">@${username}</button>
          <button onclick="handleLogout()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold">Log Out</button>
        </div>`;
    } else {
      uploadBtn.classList.add('hidden');
      authHeader.innerHTML = `<button onclick="openAuthModal()" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-full font-semibold text-sm">Sign In</button>`;
    }
  }

  async function handleLogout() {
    await db.auth.signOut();
    checkUserSession();
    loadVideos();
  }

  async function handleVideoUpload(e) {
    e.preventDefault();
    const fileInput = document.getElementById('upload-file');
    const captionInput = document.getElementById('upload-caption');
    const msg = document.getElementById('upload-message');
    const btn = document.getElementById('upload-submit-btn');

    const file = fileInput.files[0];
    if (!file) return;

    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      alert('Please log in first to upload videos!');
      return;
    }

    msg.classList.remove('hidden', 'text-red-500', 'text-green-500');
    msg.innerText = 'Uploading video... Please wait.';
    btn.disabled = true;

    const fileExt = file.name.split('.').pop();
    const filePath = `${session.user.id}/${Date.now()}.${fileExt}`;

    const { error: uploadError } = await db.storage
      .from('videos')
      .upload(filePath, file);

    if (uploadError) {
      msg.classList.add('text-red-500');
      msg.innerText = uploadError.message;
      btn.disabled = false;
      return;
    }

    const { data: publicUrlData } = db.storage
      .from('videos')
      .getPublicUrl(filePath);

    const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
    const videoUrl = publicUrlData.publicUrl;

    const { error: dbError } = await db
      .from('videos')
      .insert([{ user_id: session.user.id, username: username, caption: captionInput.value, video_url: videoUrl, likes_count: 0 }]);

    btn.disabled = false;

    if (dbError) {
      msg.classList.add('text-red-500');
      msg.innerText = dbError.message;
    } else {
      msg.classList.add('text-green-500');
      msg.innerText = 'Video uploaded successfully!';
      setTimeout(() => {
        closeUploadModal();
        fileInput.value = '';
        captionInput.value = '';
        msg.classList.add('hidden');
        loadVideos();
      }, 1500);
    }
  }

  async function likeVideo(videoId, currentLikes) {
    const newLikes = currentLikes + 1;
    const { error } = await db
      .from('videos')
      .update({ likes_count: newLikes })
      .eq('id', videoId);

    if (!error) loadVideos();
  }

  async function openComments(videoId) {
    activeVideoId = videoId;
    document.getElementById('comments-modal').classList.remove('translate-y-full');
    loadComments(videoId);
  }

  function closeCommentsModal() {
    document.getElementById('comments-modal').classList.add('translate-y-full');
    activeVideoId = null;
  }

  async function loadComments(videoId) {
    const list = document.getElementById('comments-list');
    list.innerHTML = `<p class="text-xs text-gray-400 text-center">Loading comments...</p>`;

    const { data: comments } = await db
      .from('comments')
      .select('*')
      .eq('video_id', videoId)
      .order('created_at', { ascending: false });

    if (!comments || comments.length === 0) {
      list.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No comments yet. Be the first!</p>`;
      return;
    }

    list.innerHTML = comments.map(c => `
      <div class="bg-gray-800 p-2.5 rounded-xl text-xs">
        <span class="font-bold text-red-400">@${c.username}</span>
        <p class="mt-1 text-gray-200">${c.comment_text}</p>
      </div>
    `).join('');
  }

  async function postComment(e) {
    e.preventDefault();
    const input = document.getElementById('comment-input');
    const text = input.value.trim();
    if (!text || !activeVideoId) return;

    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      alert('Please log in to comment!');
      openAuthModal();
      return;
    }

    const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
    const { error } = await db
      .from('comments')
      .insert([{ video_id: activeVideoId, user_id: session.user.id, username: username, comment_text: text }]);

    if (!error) {
      input.value = '';
      loadComments(activeVideoId);
    }
  }

  async function toggleFollow(targetUserId) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      alert('Please log in to follow creators!');
      openAuthModal();
      return;
    }

    const followerId = session.user.id;
    if (followerId === targetUserId) return;

    const { data: existing } = await db
      .from('follows')
      .select('*')
      .eq('follower_id', followerId)
      .eq('following_id', targetUserId)
      .single();

    if (existing) {
      await db.from('follows').delete().eq('follower_id', followerId).eq('following_id', targetUserId);
    } else {
      await db.from('follows').insert([{ follower_id: followerId, following_id: targetUserId }]);
    }

    viewProfile(targetUserId);
  }

  async function viewProfile(userId, fallbackUsername) {
    const container = document.getElementById('app-container');
    container.innerHTML = `<div class="h-full flex justify-center items-center text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl text-red-500"></i></div>`;

    const { data: { session } } = await db.auth.getSession();
    const currentUserId = session?.user?.id;

    const { data: videos } = await db
      .from('videos')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });

    const { count: followersCount } = await db
      .from('follows')
      .select('*', { count: 'exact', head: true })
      .eq('following_id', userId);

    let isFollowing = false;
    if (currentUserId && currentUserId !== userId) {
      const { data: followCheck } = await db
        .from('follows')
        .select('*')
        .eq('follower_id', currentUserId)
        .eq('following_id', userId)
        .single();
      if (followCheck) isFollowing = true;
    }

    // Dynamic username resolution logic:
    let profileUsername = fallbackUsername;
    if (!profileUsername || profileUsername === 'creator') {
      const videoWithUsername = videos?.find(v => v.username && v.username !== 'creator');
      if (videoWithUsername) {
        profileUsername = videoWithUsername.username;
      } else if (currentUserId === userId && session?.user) {
        profileUsername = session.user.user_metadata?.username || session.user.email.split('@')[0];
      } else {
        profileUsername = 'creator';
      }
    }

    container.innerHTML = `
      <div class="max-w-2xl mx-auto p-6 bg-black min-h-full">
        <div class="flex items-center justify-between border-b border-gray-800 pb-6">
          <div class="flex items-center space-x-4">
            <div class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl font-bold">
              ${profileUsername.charAt(0).toUpperCase()}
            </div>
            <div>
              <h2 class="text-xl font-bold">@${profileUsername}</h2>
              <p class="text-xs text-gray-400 mt-1"><span class="font-bold text-white">${followersCount || 0}</span> Followers</p>
            </div>
          </div>
          ${currentUserId && currentUserId !== userId ? `
            <button onclick="toggleFollow('${userId}')" class="px-5 py-2 rounded-full font-bold text-sm ${isFollowing ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-red-500 text-white hover:bg-red-600'} transition">
              ${isFollowing ? 'Following' : 'Follow'}
            </button>
          ` : ''}
        </div>

        <div class="mt-6">
          <h3 class="text-sm font-semibold text-gray-400 mb-3 uppercase tracking-wider">Videos</h3>
          <div class="grid grid-cols-3 gap-2">
            ${videos && videos.length > 0 ? videos.map(v => `
              <div class="aspect-[9/16] bg-gray-900 rounded-lg overflow-hidden relative group">
                <video src="${v.video_url}" class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 bg-black bg-opacity-40 flex items-end p-2 opacity-0 group-hover:opacity-100 transition">
                  <p class="text-xs truncate">${v.caption || ''}</p>
                </div>
              </div>
            `).join('') : '<p class="col-span-3 text-center text-gray-500 py-10">No videos uploaded yet.</p>'}
          </div>
        </div>
      </div>
    `;
  }

  async function loadVideos() {
    const container = document.getElementById('app-container');
    
    try {
      const { data: videos, error } = await db
        .from('videos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !videos || videos.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col justify-center items-center text-gray-500 p-4">
            <p class="font-medium text-lg">No videos yet!</p>
            <p class="text-sm text-gray-600">Be the first creator to upload a video to ViroKDK.</p>
          </div>`;
        return;
      }

      container.innerHTML = videos.map(video => {
        const displayUsername = video.username || 'creator';
        return `
          <div class="h-full w-full snap-start flex justify-center items-center relative bg-black">
            <video src="${video.video_url}" class="h-full w-auto max-w-full object-cover" loop onclick="this.paused ? this.play() : this.pause()"></video>
            
            <div class="absolute bottom-6 left-4 right-16 z-10 text-white drop-shadow-md">
              <button onclick="viewProfile('${video.user_id}', '${displayUsername}')" class="font-bold text-lg hover:underline text-left">
                @${displayUsername}
              </button>
              <p class="text-sm mt-1">${video.caption || ''}</p>
            </div>

            <div class="absolute right-4 bottom-12 flex flex-col items-center space-y-6 z-10">
              <button onclick="likeVideo('${video.id}', ${video.likes_count || 0})" class="flex flex-col items-center group">
                <div class="w-12 h-12 rounded-full bg-gray-900 bg-opacity-60 flex justify-center items-center group-hover:bg-red-500 transition">
                  <i class="fa-solid fa-heart text-xl text-red-500 group-hover:text-white"></i>
                </div>
                <span class="text-xs mt-1 font-semibold">${video.likes_count || 0}</span>
              </button>

              <button onclick="openComments('${video.id}')" class="flex flex-col items-center group">
                <div class="w-12 h-12 rounded-full bg-gray-900 bg-opacity-60 flex justify-center items-center group-hover:bg-blue-500 transition">
                  <i class="fa-solid fa-comment text-xl"></i>
                </div>
                <span class="text-xs mt-1">Chat</span>
              </button>
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      container.innerHTML = `<div class="p-4 text-center text-red-500">Failed to load feed.</div>`;
    }
  }

  checkUserSession();
  loadVideos();
</script>
